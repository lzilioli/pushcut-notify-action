name: 'Pushcut Notify'
description: 'Send push notifications via Pushcut API'
author: 'lzilioli'
branding:
  icon: 'bell'
  color: 'blue'
inputs:
  api-key:
    description: 'Pushcut API Key'
    required: true
  notification-name:
    description: 'The name of the notification, as defined in the Pushcut app'
    required: true
  title:
    description: 'Title of the notification'
    required: true
  text:
    description: 'Body text of the notification'
    required: true
  actions:
    description: 'Actions array in JSON format'
    required: false
    default: '[]'
  default-action:
    description: 'Default action in JSON format'
    required: false
    default: '{}'
  time-sensitive:
    description: 'Whether the notification should be marked as "Time-Sensitive"'
    required: false
    default: 'false'
  delay:
    description: 'Delay before sending the notification (e.g., 1h 5m 10s)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Send Pushcut Notification
      shell: bash
      run: |
        IS_TIME_SENSITIVE="false"
        if [[ "${{ inputs.time-sensitive }}" == "true" ]]; then
          IS_TIME_SENSITIVE="true"
        fi

        ACTIONS_JSON='${{ inputs.actions }}'
        DEFAULT_ACTION_JSON='${{ inputs.default-action }}'

        # Ensure inputs are valid JSON
        validate_json() {
          echo "$1" | jq . >/dev/null 2>&1 || echo "false"
        }

        if [[ "$(validate_json "$ACTIONS_JSON")" == "false" ]]; then
          ACTIONS_JSON='[]'
        fi

        if [[ "$(validate_json "$DEFAULT_ACTION_JSON")" == "false" ]]; then
          DEFAULT_ACTION_JSON='{}'
        fi

        JSON_BODY=$(jq -n --arg title "${{ inputs.title }}" \
                          --arg text "${{ inputs.text }}" \
                          --arg isTimeSensitive "$IS_TIME_SENSITIVE" \
                          --arg delay "${{ inputs.delay }}" \
                          --argjson actions "$ACTIONS_JSON" \
                          --argjson defaultAction "$DEFAULT_ACTION_JSON" \
                          '{ title: $title,
                             text: $text,
                             isTimeSensitive: ($isTimeSensitive == "true"),
                             delay: $delay,
                             actions: $actions,
                             defaultAction: $defaultAction }')

        response=$(curl -s -w "\n%{http_code}" -X POST "https://api.pushcut.io/v1/notifications/${{ inputs.notification-name }}" \
          -H "API-Key: ${{ inputs.api-key }}" \
          -H "Content-Type: application/json" \
          -d "$JSON_BODY")
        
        http_code=$(tail -n1 <<< "$response")
        body=$(sed '$ d' <<< "$response")
        
        if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
          echo "✅ Pushcut notification sent successfully"
        else
          echo "❌ Failed to send Pushcut notification. HTTP status: $http_code"
          echo "Response: $body"
          exit 1
        fi